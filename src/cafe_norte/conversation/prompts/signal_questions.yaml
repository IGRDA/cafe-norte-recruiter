# The two choice questions Jev answers about one candidate message (D52). The state it reads:
# session_language (es is Spanish, en is English), ana_said, candidate_said. Each question
# has instructions and one criterion per option; Jev returns a probability for each option.
# Measured with evals/signals.py: change a word here and run the suite on both case sets.
sentiment:
  instructions: >-
    The tone of candidate_said, the job candidate's latest message to Ana, a recruiting
    assistant. Judge the words only, never the person.
  criteria:
    neutral: Plain answers, questions, refusals or goodbyes, including a plain no.
    positive: Clear enthusiasm or thanks.
    frustrated: Annoyance, impatience, sarcasm, or feeling misunderstood or made to repeat.
    uncertain: Hesitation, doubt or confusion about what to answer.
# Which language Ana should write her next reply in (D63): one option per language Ana can
# answer in, plus `other`. The runtime takes the top option at p >= 0.7 when it is not the
# session language. Keeping session_language is the ordinary answer: a mention of a language
# (asks if it is needed for the job, says they studied it), a refused switch, or a borrowed
# word or two never leave it. A switch is asked for, said to be needed (the candidate cannot
# speak, understand or follow session_language well), or shown by a whole message written
# in the other language.
reply_language:
  instructions: >-
    The language Ana should write her next reply in, from candidate_said. session_language is
    the language of the conversation so far: it is the answer unless candidate_said asks to
    continue in another language, says the candidate cannot speak, understand or follow
    session_language well, or is written entirely in another language. Naming a language
    without asking for it, turning down a switch, or a borrowed word or two keep
    session_language.
  criteria:
    es: Spanish (español).
    en: English.
    fr: French (français).
    pt: Portuguese (português).
    it: Italian (italiano).
    de: German (Deutsch).
    ro: Romanian (română).
    ar: Arabic (العربية).
    zh: Chinese (中文).
    uk: Ukrainian (українська).
    other: A language not listed, or impossible to tell from candidate_said.
