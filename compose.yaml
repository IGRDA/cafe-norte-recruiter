# Local Postgres with the same major version as Cloud SQL, so booking and lease tests exercise
# the same semantics as deployment. `make db-up` waits for the health check.
# One project name for every checkout and worktree: they share one database container instead
# of each trying to bind 5432 during `make preview` and `make preflight`.
name: cafe-norte-recruiter-orbio

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe_norte
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafe_norte"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
