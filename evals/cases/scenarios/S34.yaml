id: S34
title: A switch to German mid-call keeps every turn saved, Chamberí
config_id: chamberi_barista_v1
language: es
today: "2026-10-20"
# Live, 22 October: after "Can you ask in German, please?" every turn failed to save on
# Postgres (turns_language_check, fixed by migration 0005). The explicit request switches the
# session to German for this very turn (D28, D63). tests/e2e/test_api_postgres.py runs this
# scenario on Postgres, where the check lives.
scripted_turns:
  - "Sí, me viene bien."
  - "Can you ask in German, please?"
  - "Ich heiße Lucía Marín."
fake_script:
  - - say: "Genial. ¿Cómo te llamas?"
  - - say: "Natürlich. Wie heißt du?"
  - - tool: update_candidate
      args:
        patch: { name: Lucía Marín }
        evidence_text: "Ich heiße Lucía Marín."
    - say: "Danke, Lucía. Interessiert dich die Stelle als Barista?"
persona:
  facts:
    name: Lucía Marín
  wants_interview: false
checks:
  - name: field_equals
    args: { field: name, value: Lucía Marín }
  - name: language_of_last_assistant_turn
    args: { language: de }
