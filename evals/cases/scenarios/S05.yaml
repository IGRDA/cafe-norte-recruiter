id: S05
title: Policy question during the interview, Chamberí
config_id: chamberi_barista_v1
language: es
today: "2026-10-20"
# The candidate asks about hours before giving any data. Ana searches, answers with a source
# shown for the offer's hours section, and returns to the field that was pending.
scripted_turns:
  - "Sí, me viene bien."
  - "Antes de nada, ¿cuántas horas a la semana son?"
  - "Me llamo Lucía Marín, sí me interesa el puesto."
fake_script:
  - - say: "Genial. ¿Cómo te llamas y te interesa el puesto de barista?"
  - - tool: search_knowledge
      args:
        question: "Antes de nada, ¿cuántas horas a la semana son?"
        queries: ["¿Cuántas horas a la semana tiene la jornada?", "horas semanales del puesto"]
    - say: "Según la oferta, la jornada es de 35 horas a la semana. ¿Cómo te llamas?"
  - - tool: update_candidate
      args:
        patch: { name: Lucía Marín, interest: "yes" }
        evidence_text: "Me llamo Lucía Marín, sí me interesa el puesto."
    - say: "Encantada, Lucía. ¿Tienes permiso de trabajo?"
persona:
  facts:
    name: Lucía Marín
    work_authorization: "yes"
    availability_days: mon,tue,thu
    availability_shifts: morning
    hours_per_week: "30"
    earliest_start_date: next monday
    experience: dos años en una cafetería
  asks:
    - ¿Cuántas horas a la semana son?
  wants_interview: false
checks:
  - name: sources_shown_for_policy_answer
    args: { turn: "2", section_prefix: "offer_chamberi#horas" }
  - name: no_cross_store_sources
  - name: field_equals
    args: { field: name, value: Lucía Marín }
  - name: max_repeated_questions
    args: { max: "0" }
rubric:
  - Ana answered with the figure from the offer and named the source briefly.
  - Ana returned to the pending question without repeating herself.
# Live mode (simulated candidate, real clock): no turn numbers, relative dates.
live_checks:
  - name: sources_shown_on_any_turn
    args: { section_prefix: offer_chamberi#horas }
  - name: field_equals
    args: { field: name, value: Lucía Marín }
  - name: brief_confirmed
  - name: lifecycle_is
    args: { lifecycle: completed }
  - name: no_fabricated_confirmed_values
  - name: no_cross_store_sources
# What a good run achieves, and the tool trajectory every good run shows (D51).
goal: "The hours question is answered from the Chamberí offer and the interview carries on collecting details."
reference_tools:
  anywhere: [search_knowledge, update_candidate]
