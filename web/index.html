<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Café Norte · Ana (demo)</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main id="app">
    <header>
      <h1>Ana · Café Norte Chamberí</h1>
      <p class="notice">Demostración ficticia de selección. Usa datos inventados. Se guardan los textos y transcripciones; no se graba audio.</p>
      <p class="status" id="status" aria-live="polite">Conectando…</p>
      <form id="access" class="access" hidden autocomplete="off">
        <label for="code">Código de acceso</label>
        <input id="code" name="code" maxlength="128" required>
        <button type="submit">Entrar</button>
      </form>
    </header>

    <section class="layout">
      <div class="conversation">
        <ol id="transcript" class="transcript" aria-label="Conversación"></ol>
        <p id="interim" class="interim" aria-live="polite"></p>
        <form id="composer" class="composer" autocomplete="off">
          <label for="text" class="visually-hidden">Tu mensaje</label>
          <input id="text" name="text" maxlength="2000" placeholder="Escribe a Ana…" required>
          <button type="submit" id="send">Enviar</button>
          <button type="button" id="talk" aria-pressed="false">🎙 Hablar</button>
        </form>
        <p id="error" class="error" role="alert" hidden></p>
      </div>

      <aside class="panel">
        <h2>Ficha del candidato</h2>
        <dl id="candidate"></dl>
        <h2>Confirmación</h2>
        <p id="confirmation" class="confirmation">—</p>
        <h2>Panel de revisión</h2>
        <ul id="review" class="review" aria-label="Eventos técnicos"></ul>
      </aside>
    </section>
    <noscript>Esta demo necesita JavaScript.</noscript>
  </main>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
