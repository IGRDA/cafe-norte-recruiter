[project]
name = "cafe-norte"
version = "0.0.1"
description = "Ana: a bilingual voice and text recruiting assistant for the fictional Café Norte."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "numpy>=2",
    "anyio>=4",
    "pyyaml>=6.0.2",
    "phonenumbers>=8.13",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# Pipecat and the three voice providers. Only the hosted voice path needs them.
voice = ["pipecat-ai[daily,deepgram,elevenlabs,silero]>=1.13"]
# Local embeddings and BM25 for the knowledge index; built into the image, not needed for text tests.
knowledge = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "python-dotenv>=1",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "types-pyyaml>=6.0.12",
    # Evaluation tooling: never imported by src/.
    "ragas>=0.2",
    # ragas 0.4 imports langchain_community.chat_models.vertexai, gone in 0.4 (D43).
    "langchain-community>=0.3,<0.4",
    "langfuse>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafe_norte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: needs CAFE_NORTE_TEST_DATABASE_URL (make test-db)",
    "live: paid provider calls; never in CI (make evals)",
]
addopts = "-m 'not postgres and not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals", "scripts"]
extend-exclude = ["evals/results", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "evals", "scripts"]
exclude = ["evals/results"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "fastembed", "ragas", "ragas.*", "pipecat", "pipecat.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/cafe_norte", "evals"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor over the whole package, stubs at 0% included; raise it as stages land (target 90).
fail_under = 80
