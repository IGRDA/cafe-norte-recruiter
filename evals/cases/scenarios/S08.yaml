id: S08
title: Candidate interrupts the slot read-back, Chamberí
config_id: chamberi_barista_v1
language: es
today: "2026-10-20"
# Line 8: Ana starts reading the interview back and the candidate speaks over her after the
# first sentence (`faults`), so the question "¿Te la reservo?" was never heard. Line 9 is a
# yes: it cannot authorize the booking, `reserve_interview` is refused, and the runtime routes
# it to the one offer to go over it. Line 10 accepts; the slot is said again as its one
# part. Line 11 answers the part that was heard, and only that books.
# Line 8 is the runtime's: it reads the first slot back itself and the candidate cuts it
# after one sentence, so the model is never called and the line has no script.
scripted_turns:
  - "Sí, me viene bien."
  - "Me llamo Lucía Marín, sí me interesa el puesto."
  - "Tengo permiso de trabajo. Puedo lunes, martes y jueves por la mañana, unas 30 horas."
  - "Podría empezar el lunes que viene. He trabajado dos años en una cafetería."
  - "Sí, es correcto."
  - "Sí, todo correcto."
  - "Sí, quiero entrevista."
  - "El primero me va bien."
  - "Sí, vale."
  - "Vale, sí."
  - "Sí, confirmo."
faults:
  - { turn: 8, kind: interrupt, after_sentences: 1 }
fake_script:
  - - say: "Genial. ¿Cómo te llamas y te interesa el puesto de barista?"
  - - tool: update_candidate
      args:
        patch: { name: Lucía Marín, interest: "yes" }
        evidence_text: "Me llamo Lucía Marín, sí me interesa el puesto."
    - say: "Encantada, Lucía. ¿Tienes permiso de trabajo y qué disponibilidad tienes?"
  - - tool: update_candidate
      args:
        patch:
          work_authorization: "yes"
          availability_days: [mon, tue, thu]
          availability_shifts: [morning]
          hours_per_week: 30
        evidence_text: "Tengo permiso de trabajo. Puedo lunes, martes y jueves por la mañana, unas 30 horas."
    - say: "Perfecto. ¿Cuándo podrías empezar y qué experiencia tienes?"
  - - tool: update_candidate
      args:
        patch: { earliest_start_date: "2026-10-26", experience: dos años en una cafetería }
        evidence_text: "Podría empezar el lunes que viene. He trabajado dos años en una cafetería."
    - say: ""
  - - tool: confirm_field
      args: { answer: affirm }
    - tool: present_confirmation
      args: { target: brief }
    - say: ""
  - - tool: confirm_brief
      args: { answer: affirm }
    - say: "¿Te gustaría tener una entrevista?"
  - - tool: list_interview_slots
      args: { evidence_text: "Sí, quiero entrevista." }
    - say: ""
  - []
  # The yes cut the slot read-back: one sentence has no offer and no parts, so the runtime
  # says it again once; what the model adds is dropped, the question being asked.
  - - say: "Perdona, me has contestado antes de acabar."
  # Heard to the end this time: the plain yes books it through the runtime; the model says so.
  - - say: "Reservada la entrevista el martes 20 de octubre a las 17:00; es una reserva simulada, sin cita real."
  # "Sí, confirmo." with the booking made: the model closes.
  - - tool: end_session
      args: { reason: candidate_done }
    - say: "Hasta pronto, Lucía."
persona:
  facts:
    name: Lucía Marín
    work_authorization: "yes"
    availability_days: mon,tue,thu
    availability_shifts: morning
    hours_per_week: "30"
    earliest_start_date: next monday
    experience: dos años en una cafetería de barrio
  wants_interview: true
checks:
  - name: claims_saved_without_save
  - name: tool_ok
    args: { turn: "9", tool: review_readback, ok: "true" }
  - name: tool_ok
    args: { turn: "10", tool: reserve_interview, ok: "true" }
  - name: tool_ok
    args: { turn: "11", tool: end_session, ok: "true" }
  - name: booking_present
  - name: lifecycle_is
    args: { lifecycle: completed }
  - name: outcome_is
    args: { outcome: reserved }
  - name: no_fabricated_confirmed_values
rubric:
  - After the interruption Ana did not treat the yes as a booking; she said the slot again once and asked.
  - The booking was made only after the slot had been heard to the end, never by re-reading the whole read-back.
