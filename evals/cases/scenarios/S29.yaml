id: S29
title: Ignacio's slot choice of 22 October, replayed with a model that invents a slot id
config_id: chamberi_barista_v1
language: es
today: "2026-10-20"
# What went wrong live: the model invented slot ids ("2026-10-24T17:00:00",
# "slot-2026-10-27T10:30"), each refusal said "Offer fresh slots", and the runtime said the
# whole list four times; "el martes de noviembre" offered Tuesday 27 October, and "el martes
# veintisiete a las diez" listed again although that slot existed. Now (D56): line 8 names a
# month with nothing free; the model's invented id is refused with the options it has, and
# nothing is said for it; line 9 names a day and a time not on offer, so the model looks that
# day up and reads its first slot back by number, with no list said; line 10's yes books it.
scripted_turns:
  - "Sí, me viene bien."
  - "Me llamo Lucía Marín, sí me interesa el puesto."
  - "Tengo permiso de trabajo. Puedo lunes, martes y jueves por la mañana, unas 30 horas."
  - "Podría empezar el lunes que viene. He trabajado dos años en una cafetería."
  - "Sí, es correcto."
  - "Sí, todo correcto."
  - "Sí, quiero entrevista."
  - "El martes de noviembre."
  - "El viernes, veintitrés, a las diez y media."
  - "Sí."
fake_script:
  - - say: "Genial. ¿Cómo te llamas y te interesa el puesto de barista?"
  - - tool: update_candidate
      args:
        patch: { name: Lucía Marín, interest: "yes" }
        evidence_text: "Me llamo Lucía Marín, sí me interesa el puesto."
    - say: "Encantada, Lucía. ¿Tienes permiso de trabajo y qué disponibilidad tienes?"
  - - tool: update_candidate
      args:
        patch:
          work_authorization: "yes"
          availability_days: [mon, tue, thu]
          availability_shifts: [morning]
          hours_per_week: 30
        evidence_text: "Tengo permiso de trabajo. Puedo lunes, martes y jueves por la mañana, unas 30 horas."
    - say: "Perfecto. ¿Cuándo podrías empezar y qué experiencia tienes?"
  - - tool: update_candidate
      args:
        patch: { earliest_start_date: "2026-10-26", experience: dos años en una cafetería }
        evidence_text: "Podría empezar el lunes que viene. He trabajado dos años en una cafetería."
    - say: ""
  - - tool: confirm_field
      args: { answer: affirm }
    - tool: present_confirmation
      args: { target: brief }
    - say: ""
  - - tool: confirm_brief
      args: { answer: affirm }
    - say: "¿Te gustaría tener una entrevista?"
  - - say: "Tengo el martes 20 a las 17:00, el miércoles 21 a las 10:30 o el miércoles 21 a las 17:00. ¿Cuál te viene mejor?"
  - - tool: present_confirmation
      args: { target: slot, slot_id: "slot-2026-11-03T10:30", evidence_text: "Sí, quiero entrevista." }
    - say: "En noviembre no tengo huecos todavía. ¿Te va bien alguno de estos días?"
  - - tool: list_interview_slots
      args: { evidence_text: "Sí, quiero entrevista.", date_preference: "2026-10-23" }
    - tool: present_confirmation
      args: { target: slot, choice: 1, evidence_text: "Sí, quiero entrevista." }
    - say: ""
  - - tool: end_session
      args: { reason: candidate_done }
    - say: "Reservada la entrevista el viernes 23 a las 10:30; es una reserva simulada, sin cita real. Hasta pronto, Lucía."
persona:
  facts:
    name: Lucía Marín
    work_authorization: "yes"
    availability_days: mon,tue,thu
    availability_shifts: morning
    hours_per_week: "30"
    earliest_start_date: next monday
    experience: dos años en una cafetería de barrio
  wants_interview: true
checks:
  - name: tool_ok
    args: { turn: "8", tool: present_confirmation, ok: "false" }
  - name: tool_ok
    args: { turn: "9", tool: list_interview_slots, ok: "true" }
  - name: tool_ok
    args: { turn: "9", tool: present_confirmation, ok: "true" }
  - name: tool_ok
    args: { turn: "10", tool: reserve_interview, ok: "true" }
  - name: booking_present
  - name: outcome_is
    args: { outcome: reserved }
  - name: max_repeated_questions
    args: { max: "1" }
live_candidate: scripted
live_checks:
  - name: booking_present
  - name: max_repeated_questions
    args: { max: "1" }
