id: S08
title: Candidate interrupts the slot read-back, Chamberí
config_id: chamberi_barista_v1
language: es
today: "2026-10-20"
# Line 8: Ana starts reading the interview back and the candidate speaks over her after the
# first sentence (`faults`), so the question "¿Te la reservo?" was never heard. Line 9 is a
# yes: it cannot authorize the booking, `reserve_interview` is refused and the read-back is
# said again in full. Line 10 answers the read-back that was heard, and only that books.
# Line 8 has no closing `say`: the turn is cut after the tool, so the model never gets there.
scripted_turns:
  - "Sí, me viene bien."
  - "Me llamo Lucía Marín, sí me interesa el puesto."
  - "Tengo permiso de trabajo. Puedo lunes, martes y jueves por la mañana, unas 30 horas."
  - "Podría empezar el lunes que viene. He trabajado dos años en una cafetería."
  - "Sí, es correcto."
  - "Sí, todo correcto."
  - "Sí, quiero entrevista."
  - "El primero me va bien."
  - "Sí, vale."
  - "Sí, confirmo."
faults:
  - { turn: 8, kind: interrupt, after_sentences: 1 }
fake_script:
  - - say: "Genial. ¿Cómo te llamas y te interesa el puesto de barista?"
  - - tool: update_candidate
      args:
        patch: { name: Lucía Marín, interest: "yes" }
        evidence_text: "Me llamo Lucía Marín, sí me interesa el puesto."
    - say: "Encantada, Lucía. ¿Tienes permiso de trabajo y qué disponibilidad tienes?"
  - - tool: update_candidate
      args:
        patch:
          work_authorization: "yes"
          availability_days: [mon, tue, thu]
          availability_shifts: [morning]
          hours_per_week: 30
        evidence_text: "Tengo permiso de trabajo. Puedo lunes, martes y jueves por la mañana, unas 30 horas."
    - say: "Perfecto. ¿Cuándo podrías empezar y qué experiencia tienes?"
  - - tool: update_candidate
      args:
        patch: { earliest_start_date: "2026-10-26", experience: dos años en una cafetería }
        evidence_text: "Podría empezar el lunes que viene. He trabajado dos años en una cafetería."
    - say: ""
  - - tool: confirm_field
      args: { answer: affirm }
    - tool: present_confirmation
      args: { target: brief }
    - say: ""
  - - tool: confirm_brief
      args: { answer: affirm }
    - say: "¿Te gustaría tener una entrevista?"
  - - tool: list_interview_slots
      args: { evidence_text: "Sí, quiero entrevista." }
    - say: ""
  - - tool: present_confirmation
      args: { target: slot, slot_id: chamberi_barista_v1-2026-10-20-1700 }
  - - tool: reserve_interview
      args: { slot_id: chamberi_barista_v1-2026-10-20-1700 }
    - tool: present_confirmation
      args: { target: slot, slot_id: chamberi_barista_v1-2026-10-20-1700 }
    - say: ""
  - - tool: reserve_interview
      args: { slot_id: chamberi_barista_v1-2026-10-20-1700 }
    - tool: end_session
      args: { reason: candidate_done }
    - say: "Reservada la entrevista el martes 20 de octubre a las 17:00; es una reserva simulada, sin cita real. Hasta pronto, Lucía."
persona:
  facts:
    name: Lucía Marín
    work_authorization: "yes"
    availability_days: mon,tue,thu
    availability_shifts: morning
    hours_per_week: "30"
    earliest_start_date: next monday
    experience: dos años en una cafetería de barrio
  wants_interview: true
checks:
  - name: tool_ok
    args: { turn: "9", tool: reserve_interview, ok: "false" }
  - name: tool_ok
    args: { turn: "9", tool: present_confirmation, ok: "true" }
  - name: tool_ok
    args: { turn: "10", tool: reserve_interview, ok: "true" }
  - name: booking_present
  - name: lifecycle_is
    args: { lifecycle: completed }
  - name: outcome_is
    args: { outcome: reserved }
  - name: no_fabricated_confirmed_values
rubric:
  - After the interruption Ana did not treat the yes as a booking; she read the interview back again and waited.
  - The booking was made only after the read-back had been heard.
