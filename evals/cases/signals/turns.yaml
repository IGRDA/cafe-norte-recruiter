# Synthetic candidate turns for the signals suite (evals/signals.py). Written by hand for the
# experiment, labelled by construction: `sentiment` is the tone of `text` alone, and
# `reply_language` the language Ana should answer the next turn in. `ana` is the sentence
# Ana said just before. `kind` says why the language label is what it is:
#   stay           plain message in the session language
#   explicit       asks to change language with a request word ("en inglés, por favor")
#   indirect       says they cannot follow the session language, without naming a request
#   written_other  a whole message in the other language, with no request (D28 keeps the
#                  session language here; this suite labels it a switch and reports it apart)
#   mention        names a language without asking for it, or refuses a switch
#   borrowed       a borrowed word or two inside the session language
# No case is a real conversation.

