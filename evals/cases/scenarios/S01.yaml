id: S01
title: Spanish happy path, Chamberí
config_id: chamberi_barista_v1
language: es
today: "2026-10-20"
# The candidate's lines.
scripted_turns:
  - "Sí, me viene bien."
  - "Me llamo Lucía Marín, sí me interesa el puesto."
  - "Tengo permiso de trabajo. Puedo lunes, martes y jueves por la mañana, unas 30 horas."
  - "Podría empezar el lunes que viene. He trabajado dos años en una cafetería."
  - "Sí, es correcto."
  - "Sí, todo correcto."
  - "Sí, quiero entrevista."
  - "El primero me va bien."
  - "Sí, confirmo."
# What a well-behaved model does on each line: tool rounds, then the sentence that ends the
# turn. Read-backs and the brief are spoken by the system, so those turns end with say: "".
fake_script:
  - - say: "Genial. ¿Cómo te llamas y te interesa el puesto de barista?"
  - - tool: update_candidate
      args:
        patch: { name: Lucía Marín, interest: "yes" }
        evidence_text: "Me llamo Lucía Marín, sí me interesa el puesto."
    - say: "Encantada, Lucía. ¿Tienes permiso de trabajo y qué disponibilidad tienes?"
  - - tool: update_candidate
      args:
        patch:
          work_authorization: "yes"
          availability_days: [mon, tue, thu]
          availability_shifts: [morning]
          hours_per_week: 30
        evidence_text: "Tengo permiso de trabajo. Puedo lunes, martes y jueves por la mañana, unas 30 horas."
    - say: "Perfecto. ¿Cuándo podrías empezar y qué experiencia tienes?"
  - - tool: update_candidate
      args:
        patch: { earliest_start_date: "2026-10-26", experience: dos años en una cafetería }
        evidence_text: "Podría empezar el lunes que viene. He trabajado dos años en una cafetería."
    - say: ""
  - - tool: confirm_field
      args: { answer: affirm }
    - tool: present_confirmation
      args: { target: brief }
    - say: ""
  - - tool: confirm_brief
      args: { answer: affirm }
    - say: "¿Te gustaría tener una entrevista?"
  - - tool: list_interview_slots
      args: { evidence_text: "Sí, quiero entrevista." }
    - say: ""
  # "El primero me va bien.": the runtime reads the first slot back itself (D41).
  - - say: ""
  - - tool: reserve_interview
      args: { slot_id: chamberi_barista_v1-2026-10-20-1700 }
    - tool: end_session
      args: { reason: candidate_done }
    - say: "Reservada la entrevista el martes 20 de octubre a las 17:00; es una reserva simulada, sin cita real. Hasta pronto, Lucía."
persona:
  facts:
    name: Lucía Marín
    work_authorization: "yes"
    availability_days: mon,tue,thu
    availability_shifts: morning
    hours_per_week: "30"
    earliest_start_date: next monday
    experience: dos años en una cafetería de barrio
  wants_interview: true
checks:
  - name: field_equals
    args: { field: name, value: Lucía Marín }
  - name: field_equals
    args: { field: interest, value: "yes" }
  - name: field_equals
    args: { field: work_authorization, value: "yes" }
  - name: field_equals
    args: { field: availability_days, value: "mon,tue,thu" }
  - name: field_equals
    args: { field: availability_shifts, value: morning }
  - name: field_equals
    args: { field: hours_per_week, value: "30" }
  - name: field_equals
    args: { field: earliest_start_date, value: "2026-10-26" }
  - name: field_equals
    args: { field: experience, value: dos años en una cafetería }
  - name: field_status
    args: { field: earliest_start_date, status: confirmed }
  - name: field_status
    args: { field: contact_phone, status: unset }
  - name: brief_confirmed
  - name: lifecycle_is
    args: { lifecycle: completed }
  - name: booking_present
  - name: outcome_is
    args: { outcome: reserved }
  - name: no_fabricated_confirmed_values
  - name: max_repeated_questions
    args: { max: "0" }
rubric:
  - Ana disclosed being an AI in the first message.
  - Ana asked one main question at a time.
# Live mode (simulated candidate, real clock): no turn numbers, relative dates.
live_checks:
  - name: brief_confirmed
  - name: field_status
    args: { field: earliest_start_date, status: confirmed }
  - name: field_equals
    args: { field: earliest_start_date, value: next monday }
  - name: lifecycle_is
    args: { lifecycle: completed }
  - name: outcome_is
    args: { outcome: reserved }
  - name: booking_present
  - name: no_fabricated_confirmed_values
  - name: no_cross_store_sources
