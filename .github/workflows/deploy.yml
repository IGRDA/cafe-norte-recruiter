# Production deployment on push to main, after the offline quality gate.
# Authentication is GitHub OIDC through Workload Identity Federation; no service-account key.
# Steps: build and push the image by digest, Terraform apply with that digest, reset the VM so
# its startup script pulls the new image, wait for readiness, then smoke-check the service. Runs never overlap. Markdown-only pushes are skipped. Actions are
# pinned by commit SHA. The app applies migrations at startup.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: deploy-demo
  cancel-in-progress: false

# Only the deploy job may mint a GCP credential; the check job installs npm and uv packages.
permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE: cafe-norte

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup
      - run: make check

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - id: build
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:${GITHUB_SHA}"
          docker build --build-arg "COMMIT_SHA=${GITHUB_SHA}" -t "$image" .
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.12"
      - run: terraform -chdir=infra/app init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=app"
      # demo.tfvars is a local, git-ignored file; CI passes the same non-secret values as TF_VAR_*.
      - run: terraform -chdir=infra/app apply -input=false -auto-approve -var "image_digest=${{ steps.build.outputs.digest }}"
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_demo_end_date: ${{ vars.DEMO_END_DATE }}
          TF_VAR_public_hostname: ${{ vars.PUBLIC_HOSTNAME }}
      # The instance only reads its image metadata at boot (startup.sh); a reset is the deploy.
      - run: gcloud compute instances reset "$SERVICE" --zone "$REGION-b" --project "$PROJECT_ID" --quiet
      - run: |
          url="$(terraform -chdir=infra/app output -raw service_url)"
          # After the reset docker restarts the previous release, which answers while the
          # new image is pulled: wait for this commit, then for readiness.
          for _ in $(seq 1 60); do
            curl -fsS --max-time 5 "$url/api/runtime" | grep -qF "\"commit_sha\":\"${GITHUB_SHA}\"" \
              && curl -fsS --max-time 5 "$url/health/ready" >/dev/null && exit 0
            sleep 5
          done
          echo "commit ${GITHUB_SHA} not serving and ready after 5 minutes" >&2; exit 1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked --all-extras  # the smoke check needs Python only, not the page's Node
      - run: uv run python scripts/ops/smoke.py "$(terraform -chdir=infra/app output -raw service_url)"
        env:
          SMOKE_ACCESS_CODE: ${{ secrets.SMOKE_ACCESS_CODE }}
