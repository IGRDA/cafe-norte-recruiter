id: S06
title: Other-store and unknown questions, Arganzuela
config_id: arganzuela_barista_v1
language: es
today: "2026-10-20"
# A question about the other store must be answered store-bound (no Chamberí chunk can be
# shown); a question nobody wrote about gets an honest "I do not know".
scripted_turns:
  - "Sí, me viene bien."
  - "¿Cuánto se cobra en Chamberí?"
  - "¿Y hay parking para empleados?"
  - "Sí, que me lo digan, por favor."
fake_script:
  - - say: "Genial. ¿Cómo te llamas y te interesa el puesto de barista?"
  - - tool: search_knowledge
      args:
        question: "¿Cuánto se cobra en Chamberí?"
        queries: ["¿Cuál es el salario del puesto de barista?"]
        topic: pay
    - say: "Solo tengo la información de Arganzuela: según la oferta, 800 euros brutos al mes en 14 pagas. ¿Cómo te llamas?"
  - - tool: search_knowledge
      args:
        question: "¿Y hay parking para empleados?"
        queries: ["¿Hay aparcamiento o parking para el personal?", "plaza de garaje para empleados"]
        topic: any
    - say: "No tengo esa información. ¿Quieres que una persona del equipo te responda más adelante?"
  - - tool: request_human_followup
      args: { reason: "¿Hay parking para empleados?" }
    - say: "Anotado; en esta demostración no se avisa a nadie real. ¿Cómo te llamas?"
persona:
  facts:
    name: Lucía Marín
    work_authorization: "yes"
    availability_days: mon,tue,thu
    availability_shifts: morning
    hours_per_week: "30"
    earliest_start_date: next monday
    experience: dos años en una cafetería
  asks:
    - ¿Cuánto se cobra en Chamberí?
    - ¿Y hay parking para empleados?
  wants_interview: false
checks:
  - name: no_cross_store_sources
  - name: sources_shown_for_policy_answer
    args: { turn: "2", section_prefix: "offer_arganzuela#salario" }
  - name: no_fabricated_confirmed_values
  - name: review_flag_present
    args: { kind: human_followup }
rubric:
  - Ana did not state any Chamberí figure.
  - Ana said plainly that she lacked the parking information, offered human follow-up and saved it when accepted.
# Live mode (simulated candidate, real clock): no turn numbers, relative dates.
live_checks:
  - name: sources_shown_on_any_turn
    args: { section_prefix: offer_arganzuela#salario }
  - name: review_flag_present
    args: { kind: human_followup }
  - name: no_fabricated_confirmed_values
  - name: no_cross_store_sources
# What a good run achieves, and the tool trajectory every good run shows (D48).
goal: "No answer comes from another store's documents, nothing about parking is invented, and a human follow-up is flagged."
reference_tools:
  anywhere: [search_knowledge, request_human_followup]
