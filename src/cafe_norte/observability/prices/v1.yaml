# Provider prices in USD, converted to EUR at load time. A price is data, not code:
# change this file, bump `version`, update `verified_on`. Re-verify before every release.
version: "2026-10-22.1"
verified_on: 2026-10-21
# ECB euro reference rate of 21 October 2026, USD per 1 EUR.
usd_per_eur: 1.1234
prices:
  # https://developers.openai.com/api/docs/models/gpt-4o-mini : $0.15 / 1M in, $0.075 / 1M
  # cached in, $0.60 / 1M out. Cached input is its own record.
  - kind: llm_tokens
    unit_detail: "gpt-4o-mini:input"
    usd_per_unit: 0.00000015
    source: https://developers.openai.com/api/docs/models/gpt-4o-mini
  - kind: llm_tokens
    unit_detail: "gpt-4o-mini:input_cached"
    usd_per_unit: 0.000000075
