# The numeric judges: pass means a score of 0.5 or more. Answers from the gpt-4o-mini baseline
# of 22 October (D51) where they exist.
- id: faithfulness-grounded
  criterion: faithfulness
  expected: pass
  question: "Where is the Arganzuela store and how much does the barista job pay?"
  answer: "Café Norte Arganzuela is located at Paseo Imaginario 45, 28045 Madrid, near Madrid Río. The barista position pays 800 euros gross per month in 14 payments."
  contexts:
    - "Dónde está la tienda: el local de Café Norte Arganzuela queda en Paseo Imaginario 45, 28045 Madrid, en el barrio de Arganzuela, junto a Madrid Río."
    - "El puesto de barista en Café Norte Arganzuela es a tiempo parcial y se paga con 800 euros brutos al mes en 14 pagas, es decir, 11.200 euros brutos al año."
- id: faithfulness-not-in-the-sources
