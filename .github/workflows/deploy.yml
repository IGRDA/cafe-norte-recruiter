# Production deployment on push to main, after the offline quality gate.
# Authentication is GitHub OIDC through Workload Identity Federation; no service-account key.
# Steps: build and push the image by digest, Terraform apply with that digest, run migrations
# with the migration identity, smoke-check the service. Runs never overlap. Markdown-only
# pushes are skipped. Pin action SHAs before the first real deployment.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE: cafe-norte

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: make setup
      - run: make check

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - id: build
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:${GITHUB_SHA}"
          docker build -t "$image" .
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - run: terraform -chdir=infra/app init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=app"
      - run: terraform -chdir=infra/app apply -input=false -auto-approve -var-file=../environments/demo.tfvars -var "image_digest=${{ steps.build.outputs.digest }}"
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
      # Migrations run once, under the database lock, with the migration identity, after the
      # new revision is deployed but before it is healthy enough to receive traffic (startup
      # probe waits on schema readiness). A failure here fails the job and keeps the old revision.
      - uses: astral-sh/setup-uv@v5
      - run: make setup
      - run: echo "TODO: run migrations through the Cloud SQL connector with the migrator identity"
      - run: uv run python scripts/smoke.py "$(terraform -chdir=infra/app output -raw service_url)"
        env:
          SMOKE_ACCESS_CODE: ${{ secrets.SMOKE_ACCESS_CODE }}
