id: S02
title: English happy path, Arganzuela
config_id: arganzuela_barista_v1
language: en
today: "2026-10-20"
# S01 in English at the other store, with a pay question mid-collection: the query goes to the
# knowledge base in Spanish, the answer and every system sentence come back in English.
scripted_turns:
  - "Yes, now is fine."
  - "I'm Lucy Martin, and yes, I'm interested."
  - "How much does it pay?"
  - "Yes, I have a work permit. I can do weekends, about 20 hours."
  - "I could start next Monday. I've worked as a barista for a year."
  - "Yes, that's right."
  - "Yes, all correct."
  - "Yes, I'd like an interview."
fake_script:
  - - say: "Great. What's your name, and are you interested in the barista role?"
  - - tool: update_candidate
      args:
        patch: { name: Lucy Martin, interest: "yes" }
        evidence_text: "I'm Lucy Martin, and yes, I'm interested."
    - say: "Nice to meet you, Lucy. Do you have permission to work, and when are you available?"
  - - tool: search_knowledge
      args:
        question: "How much does it pay?"
        queries: ["¿Cuál es el salario del puesto de barista?", "sueldo bruto mensual y pagas"]
    - say: "According to the offer, 800 euros gross a month in 14 payments. Do you have permission to work, and which days suit you?"
  - - tool: update_candidate
      args:
        patch:
          work_authorization: "yes"
          availability_days: [sat, sun]
          availability_shifts: [weekend]
          hours_per_week: 20
        evidence_text: "Yes, I have a work permit. I can do weekends, about 20 hours."
    - say: "Great. When could you start, and what experience do you have?"
  - - tool: update_candidate
      args:
        patch: { earliest_start_date: "2026-10-26", experience: a year as a barista }
        evidence_text: "I could start next Monday. I've worked as a barista for a year."
    - say: ""
  - - tool: confirm_field
      args: { answer: affirm }
    - tool: present_confirmation
      args: { target: brief }
    - say: ""
  - - tool: confirm_brief
      args: { answer: affirm }
    - say: "Would you like an interview?"
  - - tool: update_candidate
      args: { patch: { note: wants an interview }, evidence_text: "Yes, I'd like an interview." }
    - tool: end_session
      args: { reason: candidate_done }
    - say: "Thanks, Lucy. Interviews aren't booked in this version yet. Bye for now."
persona:
  facts:
    name: Lucy Martin
    work_authorization: "yes"
    availability_days: sat,sun
    availability_shifts: weekend
    hours_per_week: "20"
    earliest_start_date: next monday
    experience: a year as a barista
  asks:
    - How much does it pay?
  wants_interview: true
checks:
  - name: claims_saved_without_save
  - name: field_equals
    args: { field: name, value: Lucy Martin }
  - name: field_equals
    args: { field: availability_shifts, value: weekend }
  - name: field_equals
    args: { field: hours_per_week, value: "20" }
  - name: field_status
    args: { field: earliest_start_date, status: confirmed }
  - name: sources_shown_for_policy_answer
    args: { turn: "3", section_prefix: "offer_arganzuela#salario" }
  - name: no_cross_store_sources
  - name: brief_confirmed
  - name: brief_language
    args: { language: en }
  - name: language_of_last_assistant_turn
    args: { language: en }
  - name: lifecycle_is
    args: { lifecycle: completed }
  - name: outcome_is
    args: { outcome: brief_only }
  - name: no_fabricated_confirmed_values
  - name: max_repeated_questions
    args: { max: "0" }
rubric:
  - Every one of Ana's sentences was in English.
  - The pay answer matched the Arganzuela offer and named its source, with no Chamberí figure.
# Live mode (simulated candidate, real clock): no turn numbers, relative dates.
live_checks:
  - name: claims_saved_without_save
  - name: brief_confirmed
  - name: brief_language
    args: { language: en }
  - name: language_of_last_assistant_turn
    args: { language: en }
  - name: sources_shown_on_any_turn
    args: { section_prefix: offer_arganzuela#salario }
  - name: lifecycle_is
    args: { lifecycle: completed }
  - name: outcome_is
    args: { outcome: reserved }
  - name: booking_present
  - name: no_fabricated_confirmed_values
  - name: no_cross_store_sources
# What a good run achieves, and the tool trajectory every good run shows.
goal: "In English throughout, the pay question is answered from the Arganzuela offer and the brief is confirmed."
reference_tools:
  in_order: [update_candidate, present_confirmation, confirm_brief, end_session]
  anywhere: [search_knowledge]
